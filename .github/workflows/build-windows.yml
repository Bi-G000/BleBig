name: Build and Release BleBig

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Configure version and update channel
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { python -c "import blebig; print(blebig.__version__)" }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $channel = Get-Content assets/update-channel.json -Raw
          $channel = $channel.Replace("__GITHUB_REPOSITORY__", "${{ github.repository }}")
          Set-Content assets/update-channel.json $channel -Encoding UTF8
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt -r requirements-build.txt
      - name: Test
        run: python scripts/smoke_test.py
      - name: Package app
        run: |
          pyinstaller --noconfirm --clean BleBig.spec
          pyinstaller --noconfirm --clean BleBigUpdater.spec
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\BleBig.iss"'
      - name: Build incremental update
        shell: pwsh
        run: |
          python scripts/create_update.py --version "$env:RELEASE_VERSION" --root dist/BleBig --output "release/BleBig-Update-v$env:RELEASE_VERSION.zip" --change "Cập nhật BleBig $env:RELEASE_VERSION" --all
      - uses: actions/upload-artifact@v4
        with:
          name: BleBig-Windows-${{ env.RELEASE_VERSION }}
          path: |
            release/BleBig-Setup.exe
            release/BleBig-Update-v${{ env.RELEASE_VERSION }}.zip
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/BleBig-Setup.exe
            release/BleBig-Update-v${{ env.RELEASE_VERSION }}.zip
